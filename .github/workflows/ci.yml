name: SentinelGraph CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sentinelgraph
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_dev_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sentinelgraph"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend & test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Ruff lint
        run: ruff check backend tests

      - name: Initialize PostgreSQL non-superuser RLS runtime role
        run: |
          python - <<'PY'
          import pathlib, psycopg
          sql = pathlib.Path("infra/postgres/init.sql").read_text()
          with psycopg.connect("postgresql://postgres:postgres_dev_pw@localhost:5432/sentinelgraph", autocommit=True) as conn:
              conn.execute(sql)
          PY

      - name: Apply Alembic migrations and seed synthetic demo tenant
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres_dev_pw@localhost:5432/sentinelgraph
          DATABASE_ADMIN_URL: postgresql+psycopg://postgres:postgres_dev_pw@localhost:5432/sentinelgraph
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: test
          SECRET_KEY: ci-test-secret-key-at-least-32-bytes-long
          ENCRYPTION_MASTER_KEY: ZGV2LW9ubHktZmVybmV0LWtleS1vdmVycmlkZS0wMDA9
        run: |
          cd backend
          alembic upgrade head
          python -m app.seed

      - name: Run unit, integration, security, and performance tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
          DATABASE_URL: postgresql+psycopg://sentinelgraph_app:sentinelgraph_dev_pw@localhost:5432/sentinelgraph
          DATABASE_ADMIN_URL: postgresql+psycopg://postgres:postgres_dev_pw@localhost:5432/sentinelgraph
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: test
          SECRET_KEY: ci-test-secret-key-at-least-32-bytes-long
          ENCRYPTION_MASTER_KEY: ZGV2LW9ubHktZmVybmV0LWtleS1vdmVycmlkZS0wMDA9
        run: |
          pytest tests/unit tests/integration tests/performance -v

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies and build
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: docker compose config -q
